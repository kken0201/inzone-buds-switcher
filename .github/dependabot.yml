version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # 公開から 7 日たった版だけを提案する。悪意のある版は公開後すぐに見つかって取り下げられることが多いため
    cooldown:
      default-days: 7
    # 依存は最初に当てはまったグループに入る
    groups:
      # windows と windows-core は版をそろえないとビルドが通らないので、更新の種類によらず一緒に上げる
      windows:
        patterns: ["windows", "windows-core"]
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]
      cargo-minor:
        patterns: ["*"]
        update-types: ["minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
