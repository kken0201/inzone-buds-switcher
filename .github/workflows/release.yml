name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # ビルドの来歴（attestation）を付けるため
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches Cargo.toml version
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - run: cargo test --locked

      - run: cargo build --release --locked

      - name: Package
        run: |
          $zip = "inzone-buds-switcher-${{ github.ref_name }}.zip"
          Compress-Archive -Path target/release/inzone-buds-switcher.exe, LICENSE -DestinationPath $zip
          # 自動更新（docs/design.md 4.8）が取ってくる exe 単体
          Copy-Item target/release/inzone-buds-switcher.exe inzone-buds-switcher.exe
          "ZIP=$zip" >> $env:GITHUB_ENV

      # 「このリポジトリのこのコミットからビルドした」という証明を付ける。`gh attestation verify` で確かめられる
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            inzone-buds-switcher.exe
            ${{ env.ZIP }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        # Immutable releases では公開後にファイルを足せないので、下書きでファイルを上げてから公開する
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP" inzone-buds-switcher.exe --title "${{ github.ref_name }}" --generate-notes --draft
          gh release edit "${{ github.ref_name }}" --draft=false
