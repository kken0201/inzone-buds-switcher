name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match Cargo.toml version $version"
          }

      - run: cargo test --locked

      - run: cargo build --release --locked

      - name: Package
        run: |
          $zip = "inzone-buds-switcher-${{ github.ref_name }}.zip"
          Compress-Archive -Path target/release/inzone-buds-switcher.exe, LICENSE -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "$env:ZIP" --title "${{ github.ref_name }}" --generate-notes
