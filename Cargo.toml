[package]
name = "inzone-buds-switcher"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
windows-core = "0.62"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_HumanInterfaceDevice", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Threading", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_Shell_Common", "Win32_System_Variant", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Console", "Win32_Networking_WinHttp"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tracing-appender = "0.2"

[build-dependencies]
embed-resource = "3.0.12"
